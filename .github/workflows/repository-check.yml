name: Repository checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check source selection and all Git refs
        run: python3 scripts/check_repository.py --download-gitleaks --reports-dir "$RUNNER_TEMP/cyai-checks"
      - name: Test optional components and package rules
        run: |
          python3 -m unittest discover -s tests -p test_optional_components.py -v
          python3 -m unittest discover -s tests -p test_package_policy.py -v
          python3 -m unittest discover -s tests -p test_extension_catalog.py -v
          python3 -m unittest discover -s tests -p test_cytask_bridge.py -v
      - name: Test repository selection and detection rules
        env:
          GITLEAKS_BINARY: ${{ runner.temp }}/cyai-checks/tools/gitleaks
        run: python3 -m unittest discover -s tests -p test_repository_checks.py -v
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Generate and validate local CyDoc documentation
        run: |
          python3 scripts/build_documentation.py --check
          python3 scripts/build_documentation.py --install
      - name: Test interface localization and browser handlers
        run: |
          python3 -m unittest discover -s tests -p test_i18n.py -v
          python3 -m unittest discover -s tests -p test_help.py -v
          python3 -m unittest discover -s tests -p test_documentation_pages.py -v
          node tests/help.cjs
          node tests/i18n.cjs
          node tests/ui-async-regressions.cjs
          node tests/voice-settings-render.cjs
          node tests/optional-components-ui.cjs
