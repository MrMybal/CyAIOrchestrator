<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>CyAI Orchestrator</title><link rel="icon" type="image/png" href="/cyai-logo.png"><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/help.css"></head>
<body>
<div class="app shell">
  <nav id="server-rail" class="server-rail" aria-label="Projets"></nav>
  <aside class="sidebar channel-list">
    <div id="channel-header" class="channel-header"></div>
    <div id="home-channels" class="home-channels">
      <div id="home-list" class="home-list"></div>
      <div class="home-projects"><span>PROJETS</span><button class="icon" data-workspace-action="category" title="Créer une catégorie de projets" aria-label="Créer une catégorie de projets">▦</button><button id="toggle-archives" class="icon" title="Afficher les archives" aria-label="Afficher les archives">▤</button><button id="new-project" class="icon" title="Ajouter un projet" aria-label="Ajouter un projet">＋</button></div>
    </div>
    <div id="project-channels" class="project-channels" hidden></div>
    <div class="sidebar-footer"><div class="local-status"><span class="dot"></span><span>Stockage local</span><span class="version">v0.1</span></div></div>
  </aside>
  <main>
    <header class="topbar"><div class="topbar-title"><span id="topbar-glyph" class="topbar-glyph" aria-hidden="true">#</span><h1 id="page-title">Conversation</h1><span class="breadcrumb" hidden><span id="project-name">Aucun projet</span></span></div><div class="top-actions"><form id="header-search" class="header-search" role="search"><input id="header-search-input" type="search" aria-label="Rechercher dans l’historique" placeholder="Rechercher"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></form><button id="open-pins" class="top-icon" title="Épinglés du projet" aria-label="Épinglés du projet" hidden><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 17v5"/><path d="M9 3h6l-1 6 4 4v2H6v-2l4-4z"/></svg></button><button id="toggle-members" class="top-icon" aria-controls="member-list" title="Membres" aria-label="Membres" hidden><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><circle cx="17" cy="9" r="2.6"/><path d="M16.5 14.6c2.6.2 4.4 1.9 5 5.4"/></svg></button><button id="toggle-inspector" class="top-icon" aria-controls="inspector" title="Détails de conversation" aria-label="Détails de conversation"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg></button></div></header>
    <div id="notice" class="notice" hidden></div>
    <div class="main-body">
    <div id="workspace" class="workspace">
      <section class="conversation-pane">
        <div id="conversation-toolbar" class="conversation-toolbar" hidden><span id="conversation-subtitle">Conversation persistante</span><div><button id="rename" class="text-button">Renommer</button><button id="export" class="text-button">Exporter</button><button id="archive" class="text-button">Archiver</button><button id="delete" class="text-button danger">Supprimer</button></div></div>
        <div id="messages" class="messages" aria-live="polite"></div>
        <div id="plan-panel" class="plan-panel" hidden></div>
        <div id="composer-area" class="composer-area">
          <div id="orchestrator-tools" class="context-selection" hidden><span>Discussion → plan → autorisation → exécution</span><button id="refresh-catalog" class="text-button" type="button">Voir les IA disponibles</button></div>
          <div id="voice-bar" class="voice-bar" role="status" aria-live="polite" hidden></div>
          <form id="composer" class="composer">
            <div class="composer-config"><div class="agent-options"><span class="agent-dot"></span><label class="sr-only" for="agent">Agent</label><select id="agent"><option value="command-code">Command Code</option><option value="codebuddy">CodeBuddy</option><option value="antigravity">Antigravity</option><option value="devin">Devin CLI</option><option value="openrouter">OpenRouter</option><option value="codex" selected>Codex</option><option value="claude-code">Claude Code</option><option value="opencode">OpenCode</option><option value="anthropic">Claude · API</option><option value="ollama">Ollama · local</option><option value="local">CyAI · local</option></select><span class="separator"></span><input id="model" aria-label="Modèle" placeholder="Modèle du connecteur" list="model-list"><datalist id="model-list"></datalist><select id="model-effort" aria-label="Effort de raisonnement"><option value="">Effort : défaut</option></select><select id="model-tier" aria-label="Vitesse du modèle"><option value="">Vitesse : défaut</option></select></div><div class="composer-actions"><div id="plugin-toolbar" class="plugin-toolbar" hidden></div><button type="button" id="voice-mic" class="composer-voice" aria-label="Dicter dans la saisie, avec relecture avant l’envoi">🎙</button><button type="button" id="voice-direct" class="composer-voice direct" aria-pressed="false" aria-label="Discussion directe : parler sans toucher au clavier">🗣</button><button type="button" id="voice-read" class="text-button" title="Lire à voix haute les prochaines réponses de cette conversation">🔈</button></div><div id="context-selection" class="context-selection"><span class="dot"></span> Contexte automatique <button type="button" id="preview-context" class="text-button">Inspecter le contexte ↗</button></div></div>
            <div id="composer-usage" class="composer-usage" role="status"></div>
            <div class="composer-input"><button type="button" id="attach" class="composer-attach" title="Joindre des images, vidéos ou fichiers" aria-label="Joindre un fichier">＋</button><label for="instruction" class="sr-only">Votre instruction</label><textarea id="instruction" placeholder="Décrivez votre objectif, votre agent prend le relais…" rows="1"></textarea><button type="submit" class="send" aria-label="Envoyer l’instruction (Entrée)" title="Envoyer (Entrée ; Maj+Entrée pour un saut de ligne)">↑</button></div>
          </form>
        </div>
      </section>
      <aside id="inspector" class="inspector"><div class="inspector-title">SUIVI D’EXÉCUTION <span class="muted">◉</span></div><div id="mission-panel"></div></aside>
    </div>
    <section id="page" class="page" hidden></section>
    <aside id="member-list" class="member-list" aria-label="Membres de l’équipe" hidden></aside>
    </div>
  </main>
<button id="settings-close" class="settings-close" title="Fermer (Échap)" aria-label="Fermer" hidden><span>✕</span><small>ÉCHAP</small></button>
</div>
<dialog id="dialog"><form id="dialog-form"><div class="dialog-heading"><h2 id="dialog-title"></h2><button type="button" id="close-dialog" class="icon" aria-label="Fermer">×</button></div><div id="dialog-content"></div><div id="dialog-error" class="error" role="alert"></div><div class="dialog-actions"><button id="cancel-dialog" type="button" class="secondary">Annuler</button><button id="submit-dialog" class="primary" type="submit">Enregistrer</button></div></form></dialog>
<div id="toast" role="status" hidden></div>
<script src="/i18n.js"></script><script src="/project.js"></script><script src="/plugins.js"></script><script src="/workspace.js"></script><script src="/annotation.js"></script><script src="/intelligence.js"></script><script src="/analytics.js"></script><script src="/tabs.js"></script><script src="/teams.js"></script><script src="/board.js"></script><script src="/methods.js"></script><script src="/local-models.js"></script><script src="/cymd-editor.js"></script><script src="/media.js"></script><script src="/help.js"></script><script src="/app.js"></script><script src="/channels.js"></script><script src="/method-editor.js"></script><script src="/method-writer.js"></script><script src="/method-lab.js"></script><script src="/team-lead.js"></script><script src="/spaces.js"></script><script src="/voice.js"></script>
</body></html>
